  </defs>

  <!-- Geometric Symbol (Ramps / Escalating Blocks) -->
  <g transform="translate(10, 15)">
    <!-- Block 1 (Smallest - Left) -->
    <!-- Front Face -->
    <polygon points="0,110 0,90 42,72 42,110" fill="url(#ramp1)"/>
    <!-- Fold / Shadow Angle -->
    <polygon points="42,72 58,94 58,110 42,110" fill="url(#ramp1Dark)"/>

    <!-- Block 2 (Middle) -->
    <!-- Front Face -->
    <polygon points="58,110 58,80 115,44 115,110" fill="url(#ramp2)"/>
    <!-- Fold / Shadow Angle -->
    <polygon points="115,44 135,76 135,110 115,110" fill="url(#ramp2Dark)"/>

    <!-- Block 3 (Tallest - Right) -->
    <!-- Tall architectural wedge -->
    <polygon points="135,110 135,62 195,10 195,110" fill="url(#ramp3)"/>
  </g>

