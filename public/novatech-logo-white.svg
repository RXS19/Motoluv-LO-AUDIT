<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 710 140" width="710" height="140">
  <defs>
    <!-- Lighting Gradients for 3D Poly facets in White/Silver mode -->
    <linearGradient id="ramp1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D4D4D8"/>
    </linearGradient>
    <linearGradient id="ramp1Dark" x1="0%" y1="0%" x2="100%" y2="100%">
