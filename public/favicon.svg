<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%" fx="40%" fy="30%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>

    <!-- Red Bars Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C70500"/>
      <stop offset="35%" stop-color="#E10600"/>
      <stop offset="75%" stop-color="#F51E17"/>
      <stop offset="100%" stop-color="#FF3832"/>
    </linearGradient>

    <!-- Top Bevel Highlight Gradient -->
    <linearGradient id="topBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFA19C" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FF524A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF8A84" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Bottom Shadow Gradient -->
    <linearGradient id="bottomShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#5E0200" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="motoluvGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#E10600" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="106" fill="none" stroke="#27272a" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Icon Group -->
  <g filter="url(#motoluvGlow)">
    <!-- Top Bar (Short) -->
    <g>
      <!-- Base shape -->
      <polygon points="96,242 96,172 340,48 340,118" fill="url(#redGrad)"/>
      <!-- Top edge bevel -->
      <polygon points="96,172 340,48 336,54 100,176" fill="url(#topBevel)"/>
      <!-- Bottom edge shadow -->
      <polygon points="96,242 340,118 336,112 100,236" fill="url(#bottomShadow)"/>
      <!-- Right vertical edge cap -->
      <polygon points="340,48 340,118 334,115 334,51" fill="#FF7069" fill-opacity="0.4"/>
      <!-- Left vertical edge -->
      <polygon points="96,172 96,242 101,237 101,176" fill="#800200"/>
    </g>

    <!-- Middle Bar (Medium-Long) -->
    <g>
      <!-- Base shape -->
      <polygon points="96,352 96,282 436,108 436,178" fill="url(#redGrad)"/>
      <!-- Top edge bevel -->
      <polygon points="96,282 436,108 432,114 100,286" fill="url(#topBevel)"/>
      <!-- Bottom edge shadow -->
      <polygon points="96,352 436,178 432,172 100,346" fill="url(#bottomShadow)"/>
      <!-- Right vertical edge cap -->
      <polygon points="436,108 436,178 430,175 430,111" fill="#FF7069" fill-opacity="0.4"/>
      <!-- Left vertical edge -->
      <polygon points="96,282 96,352 101,347 101,286" fill="#800200"/>
    </g>

    <!-- Bottom Bar (Long) -->
    <g>
      <!-- Base shape -->
      <polygon points="96,462 96,392 436,218 436,288" fill="url(#redGrad)"/>
      <!-- Top edge bevel -->
      <polygon points="96,392 436,218 432,224 100,396" fill="url(#topBevel)"/>
      <!-- Bottom edge shadow -->
      <polygon points="96,462 436,288 432,282 100,456" fill="url(#bottomShadow)"/>
      <!-- Right vertical edge cap -->
      <polygon points="436,218 436,288 430,285 430,221" fill="#FF7069" fill-opacity="0.4"/>
      <!-- Left vertical edge -->
      <polygon points="96,392 96,462 101,457 101,396" fill="#800200"/>
    </g>
  </g>
</svg>
